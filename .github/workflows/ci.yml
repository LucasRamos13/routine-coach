name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Secrets and personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository check (forbidden files, tokens, e-mails)
        run: scripts/check-private-data.sh --all
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Tests and build
    runs-on: ubuntu-latest
    needs: privacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Rules engine, validator and renderer tests
        run: ./gradlew :core:test
      - name: Validate demo pack and library
        run: |
          ./gradlew :tools:installDist
          tools/build/install/routine-coach-tools/bin/routine-coach-tools validate --pack content/demo-pack --library content/library
      - name: Illustrations are up to date with their poses
        run: |
          tools/build/install/routine-coach-tools/bin/routine-coach-tools render --dir content/library
          git diff --exit-code -- content/library/illustrations
      - name: Build the app with the demo pack
        run: ./gradlew :app:assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Companion tests
        working-directory: companion
        run: python -m unittest -v
      - uses: actions/upload-artifact@v4
        with:
          name: routine-coach-demo-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
